[package]
name = "made-optimize"
version = "0.3.0"
edition = "2021"
description = "MadeOptimize: motor WebAssembly 100% propio en Rust para compresión/descompresión Draco, Meshopt, optimización GPU, BVH + Frustum Culling, LOD (QEM) y Meshlets en Made3D"
license = "MIT"

[lib]
name = "made_optimize"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
